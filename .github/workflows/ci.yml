name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Package manager policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Yarn and reject competing lockfiles
        shell: bash
        run: |
          set -euo pipefail
          competing_lockfiles=(
            package-lock.json
            npm-shrinkwrap.json
            pnpm-lock.yaml
            bun.lock
            bun.lockb
          )
          for lockfile in "${competing_lockfiles[@]}"; do
            if [[ -e "$lockfile" ]]; then
              echo "::error::Unexpected lockfile found: $lockfile"
              exit 1
            fi
          done
          test -f yarn.lock
          grep -q '"packageManager": "yarn@' package.json

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Cache quality-tool state
        uses: actions/cache@v4
        with:
          path: .cache
          key: quality-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'tsconfig.json', 'eslint.config.js', '.prettierrc.json') }}
          restore-keys: |
            quality-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

  build:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web export
        run: yarn build:check

  commitlint:
    name: Commit message checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate pull request commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
